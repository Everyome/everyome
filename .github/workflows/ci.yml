# Intent: run the tests on every push and pull request on Linux, with the oldest and newest supported Python.
# macOS runs on demand (Actions tab: CI, "Run workflow"; or `gh workflow run CI -f macos=true`) and on release tags,
# because macOS minutes count ten times against the organisation's Actions allowance.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also test on macOS (macOS minutes count ten times)"
        type: boolean
        default: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.macos) || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  # Intent: the app's screens in a real browser (tests/test_browser.py): pages open without JavaScript errors, dialogs
  # open once and close. Linux only; the screens are the same on every system.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_browser.py
