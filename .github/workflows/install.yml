# Intent: run the one-line installer (install.sh) on brand-new machines, as a new user would, and check Everyome
# starts. It installs the released version from PyPI, so it runs when the installer changes, at the end of a release
# (called by release.yml once PyPI lists the upload), and on demand; macOS joins on release tags and on demand.
name: Installer
on:
  # Intent: branches only. With no "branches" filter GitHub would also run this on tag pushes (which ignore "paths").
  push:
    branches: ["**"]
    paths: ["install.sh", ".github/workflows/install.yml"]
  # Intent: not on the tag push itself: the tag now starts the upload (release.yml), so the version isn't on PyPI yet.
  workflow_call:
  pull_request:
    paths: ["install.sh", ".github/workflows/install.yml"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also test on macOS"
        type: boolean
        default: true
jobs:
  install:
    name: ${{ matrix.os }}, ${{ matrix.conda }}
    runs-on: ${{ matrix.os }}
    # Intent: "shell: bash" makes GitHub add pipefail, so a failed install piped into tee fails its own step.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.macos) || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        conda: ["no conda yet"]
        include:
          # Intent: someone who already has Anaconda's Miniconda (default channel with paid terms) keeps it, and the
          # environment still comes from conda-forge only.
          - os: ubuntu-latest
            conda: "existing conda"
    steps:
      - uses: actions/checkout@v7
      - name: Give the machine its own Miniconda first (newer runner images have none)
        if: matrix.conda == 'existing conda'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/miniconda.sh" https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash "$RUNNER_TEMP/miniconda.sh" -b -p "$RUNNER_TEMP/miniconda"
          echo "EXISTING_CONDA=$RUNNER_TEMP/miniconda" >> "$GITHUB_ENV"
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install the way a new user would (one line, piped into bash, nothing else on the PATH)
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          path=/usr/bin:/bin:/usr/sbin:/sbin
          if [ "${{ matrix.conda }}" = "existing conda" ]; then path="$EXISTING_CONDA/bin:$path"; fi
          cat install.sh | env -i HOME="$RUNNER_TEMP/home" PATH="$path" SHELL=/bin/bash TERM=dumb bash | tee "$RUNNER_TEMP/install.log"
          if [ "${{ matrix.conda }}" = "existing conda" ]; then
            grep -q "Using your conda: $EXISTING_CONDA/bin/conda" "$RUNNER_TEMP/install.log"
            if grep -q "Downloading Miniforge" "$RUNNER_TEMP/install.log"; then echo "installed Miniforge anyway"; exit 1; fi
            # Intent: the environment's packages came from conda-forge, not Anaconda's channel.
            "$EXISTING_CONDA/bin/conda" list -n everyome --show-channel-urls python | grep -q conda-forge
          fi
      - name: Everyome starts and answers
        run: |
          home="$RUNNER_TEMP/home"
          if [ "${{ matrix.conda }}" = "existing conda" ]; then conda="$EXISTING_CONDA/bin/conda"; else conda="$home/miniforge3/bin/conda"; fi
          # Intent: ask conda where the environment is (an unwritable base puts it in ~/.conda/envs instead).
          prefix="$(HOME="$home" "$conda" run -n everyome python -c 'import sys; print(sys.prefix)')"
          exe="$prefix/bin/everyome"
          HOME="$home" "$exe" --no-browser --port 8777 > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8777/ > /dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:8777/ | grep -qi everyome || { cat "$RUNNER_TEMP/app.log"; exit 1; }
          "$(dirname "$exe")/python" -c "import scanpy, pydeseq2, primer3, everyome_pipelines, everyome; print('Everyome', everyome.__version__)"
      - name: The icon was added
        run: |
          home="$RUNNER_TEMP/home"
          if ! grep -q "Adding the Everyome icon" "$RUNNER_TEMP/install.log"; then
            # Intent: only a version from before the icon may skip it (the installer checks for --shortcut).
            if "$(dirname "$(find "$home" -path '*envs/everyome/bin/everyome' | head -1)")/everyome" --help | grep -q -- --shortcut; then
              echo "this version has the icon but the installer did not add it"; exit 1
            fi
            echo "the installed version predates the icon"; exit 0
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            test -x "$home/Applications/Everyome.app/Contents/MacOS/Everyome"
          else
            grep -q "Exec=" "$home/.local/share/applications/everyome.desktop"
          fi
          grep -q "open the Everyome icon" "$RUNNER_TEMP/install.log"
      - name: Running it again reuses the installation
        if: matrix.conda == 'no conda yet'
        run: |
          cat install.sh | env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/bash TERM=dumb bash | tee "$RUNNER_TEMP/again.log"
          grep -q "Using your conda" "$RUNNER_TEMP/again.log" && grep -q "Reusing environment 'everyome'" "$RUNNER_TEMP/again.log"
