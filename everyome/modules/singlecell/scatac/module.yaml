# Single-cell ATAC-seq: chromap (pinned container) turns each sample's reads into fragments on the cluster; a live
# session reads them with SnapATAC2, filters cells, clusters them on genome tiles and names them from gene activity.
spec: 1
id: singlecell.scatac
name: Single-cell ATAC-seq
suite: singlecell
version: 0.1.0
summary: >
  Finds cell types from open chromatin. On the cluster, chromap aligns each
  sample's reads and writes one fragment per read pair; in a live session,
  SnapATAC2 reads the fragments, you remove poor cells (few fragments, low TSS
  enrichment), cells are clustered on the genome's open regions, and clusters
  are named from gene activity (open chromatin over each gene). Works with any
  genome you have as FASTA and GTF. Already have fragments (for example from
  Cell Ranger ATAC)? Give those instead of reads.
authors: ["Helen R Horkan"]
licence: same as Everyome
cite:
  - text: "Zhang K. et al. (2024). SnapATAC2: a fast, scalable and versatile tool for analysis of single-cell omics data. Nature Methods 21:217–227."
    url: https://doi.org/10.1038/s41592-023-02139-9
  - text: "Zhang H. et al. (2021). Fast alignment and preprocessing of chromatin profiles with Chromap. Nature Communications 12:6566."
    url: https://doi.org/10.1038/s41467-021-26865-w
  - text: "Buenrostro J.D. et al. (2015). Single-cell chromatin accessibility reveals principles of regulatory variation. Nature 523:486–490."
    url: https://doi.org/10.1038/nature14590
  - text: "Korsunsky I. et al. (2019). Fast, sensitive and accurate integration of single-cell data with Harmony. Nature Methods 16:1289–1296."
    url: https://doi.org/10.1038/s41592-019-0619-0
  - text: "Traag V.A., Waltman L., van Eck N.J. (2019). From Louvain to Leiden: guaranteeing well-connected communities. Scientific Reports 9:5233."
    url: https://doi.org/10.1038/s41598-019-41695-z
  - text: "Wolf F.A., Angerer P., Theis F.J. (2018). SCANPY: large-scale single-cell gene expression data analysis. Genome Biology 19:15."
    url: https://doi.org/10.1186/s13059-017-1382-0
kind: [batch, interactive]
requires: [snapatac2, scanpy, anndata, pandas, numpy, scipy, matplotlib, openpyxl]
tools:
  - {name: apptainer, version: "apptainer --version || singularity --version"}
methods: everyome.modules.singlecell.scatac.methods:methods

inputs:
  - id: reads_dir
    label: Reads folder
    type: folder
    help: "Used only to fill in the table below: reads named <sample>_R1/_R2/_R3.fastq.gz (10x), or fragments files."
    demo: fastq
  - id: samples
    label: Samples
    type: table
    required: true
    help: >
      One row per sample: its reads (read 1, read 2 and the read holding the cell barcode; for 10x ATAC that is R2,
      16 bases long) or, instead, a fragments file you already have; then its condition and, if samples were prepared
      on different days, its batch.
    columns:
      - {id: sample, label: Sample, pattern: "[A-Za-z0-9_.-]+", pattern_help: "should use letters, digits, _ . or - only"}
      - {id: read1, label: Read 1, optional: true, wide: true}
      - {id: read2, label: Read 2, optional: true, wide: true}
      - {id: barcodes, label: Barcode read, optional: true, wide: true}
      - {id: fragments, label: Or a fragments file, optional: true, wide: true}
      - {id: condition, label: Condition, pattern: "[A-Za-z0-9_.-]+", pattern_help: "should use letters, digits, _ . or - only"}
      - {id: batch, label: Batch, optional: true, pattern: "[A-Za-z0-9_.-]*", pattern_help: "should use letters, digits, _ . or - only"}
    fill: {helper: scan, from: reads_dir, label: Find samples in the reads folder}
  - id: genome
    label: Genome (FASTA)
    type: file
    required: true
    help: "The genome the reads come from. Chromosome names must match the annotation."
    demo: reference/genome.fa
  - id: annotation
    label: Gene annotation (GTF)
    type: file
    required: true
    help: "Genes and transcripts, for TSS enrichment and gene activity. GFF3 works too."
    demo: reference/genes.gtf

params:
  - {id: whitelist, label: Barcode whitelist, type: file, group: Barcodes,
     help: "The list of valid cell barcodes for your kit (for 10x ATAC, 737K-cratac-v1.txt from Cell Ranger ATAC). Without it, barcodes are taken as read."}
  - {id: chromap_extra, label: Extra chromap options, type: text, default: "", group: Alignment, advanced: true,
     help: "Added to each chromap command, for example --min-read-length 25."}

batch:
  engine: staged
  resources: {cpus: 8, mem: 32G, time: "24:00:00", session: {cpus: 2, mem: 16G, time: "08:00:00"}}
  report: everyome.modules.singlecell.scatac.helpers:report
  # Pinned by digest: a tag can be moved to a different image, a digest cannot. Pulled once into <pipelines folder>/containers.
  containers:
    chromap: quay.io/biocontainers/chromap:0.3.2--h077b44d_0@sha256:23ffd1ae6460f7eba7f4a4a069870c137e3ab1b11da6d4369aef4641b163bb6d
  stages:
    - {id: "01", name: fragments, title: "Reads to fragments (chromap)", run: "{python} -m everyome.modules.singlecell.scatac.stage fragments"}

helpers:
  scan: everyome.modules.singlecell.scatac.helpers:scan

interactive:
  engine: everyome.modules.singlecell.scatac.engine:Engine
  ui: [../shared/cells_ui.js, ui.js]
  steps:
    - {id: load, title: Read the fragments}
    - {id: qc, title: Filter cells}
    - {id: cluster, title: Integrate and cluster}
    - {id: markers, title: Explore markers}
    - {id: annotate, title: Name clusters}
    - {id: compare, title: Compare and export}

learn:
  manual: docs/manual.md
  guides:
    run_report: docs/guides/run_report.md
    fragments: docs/guides/fragments.md
    fragment_sizes: docs/guides/fragment_sizes.md
    filter_cells: docs/guides/filter_cells.md
    mito: ../shared/guides/mito.md
    clusters: docs/guides/clusters.md
    markers: docs/guides/markers.md
    dotplot: ../shared/guides/dotplot.md
    composition: ../shared/guides/composition.md
  playground:
    scripts: [docs/playground/atac_playground.js]
    object: AtacPlayground
    lede: >
      What TSS enrichment and the fragment size ladder say about a library, on fragments simulated from cells you
      choose: how open chromatin, nucleosomes and background shape both.
    intro:
      - "A simulated cell's fragments: some from open chromatin around gene starts, some from the rest of the genome. Change how much comes from open chromatin, how many nucleosomes the fragments span, and the depth, and see the fragment sizes and the signal around gene starts."
    caveats:
      - "Real fragment sizes also depend on library preparation and size selection; peak positions here are idealised (one nucleosome is about 147 bp plus linker)."
      - "TSS enrichment here is the signal at gene starts divided by the signal 2 kb away, as ENCODE and SnapATAC2 compute it, on a single simulated profile."

demo:
  build: everyome.modules.singlecell.scatac.demo_data:build
