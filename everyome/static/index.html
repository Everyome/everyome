<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyome</title>
<style>
  /* Intent: Gothic Cream house style until the shared theme system moves over from SPLiTscape. */
  :root { --bg: #F6F0E1; --ink: #1C1620; --gold: #8F7529; --wine: #6E1B2B; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1C1620; --ink: #F6F0E1; --gold: #DFC684; --wine: #E0B3A0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  /* Gold on cream is below WCAG AA for text, so gold is kept for the rule only. */
  h1 { font-family: Didot, "Bodoni 72", Georgia, serif; font-size: 3rem; margin: 0; color: var(--ink);
       border-bottom: 2px solid var(--gold); padding-bottom: .25rem; }
  .tag { font-style: italic; color: var(--wine); margin: .5rem 0 1.5rem; font-size: 1.2rem; }
  .small { font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Everyome</h1>
  <p class="tag">Every -ome, for everyone.</p>
  <p>Omics analysis with a simple interface, where every setting stays in reach. Modules are on the way.</p>
  <p class="small">Created by Helen R Horkan PhD, Stowers Institute. Please cite it if you use it.</p>
</main>
</body>
</html>
