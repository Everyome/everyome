<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Helen R Horkan PhD">
<title>Everyome</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script>
  // Intent: apply the last-used theme before first paint, so the page never flashes the default.
  try { const v = JSON.parse(localStorage.getItem("everyome-vars") || "null");
        if (v) { for (const [k, x] of Object.entries(v.vars)) document.documentElement.style.setProperty(k, x);
                 document.documentElement.style.colorScheme = v.mode; } } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" data-go="home" aria-label="Everyome home"><em>Every</em>ome</a>
  <span class="tagline">Every -ome, for everyone.</span>
  <span class="spacer"></span>
  <div class="style-picker">
    <span class="tdots" id="tdots" aria-hidden="true"></span>
    <label class="label" for="theme-select">Style</label>
    <select id="theme-select" aria-label="Colour style"></select>
    <select id="mode-select" aria-label="Light or dark">
      <option value="system">Match system</option><option value="light">Light</option><option value="dark">Dark</option>
    </select>
  </div>
  <span class="pill" id="pill-conn"><i></i><span>Not connected</span></span>
  <span class="pill" id="pill-proj"><i></i><span>No project</span></span>
  <span class="pill" id="pill-sess"><i></i><span>No session</span></span>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Steps"></nav>
  <main id="main" tabindex="-1"><div class="page" id="page"></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
