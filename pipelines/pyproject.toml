# The pipelines Everyome ships, as a separate package so the app itself stays small.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everyome-pipelines"
version = "0.1.0a3"
description = "Pinned, checksummed Nextflow pipelines (nf-core) and plugins for Everyome, so clusters run them without downloading code."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Helen R Horkan" }]

[project.urls]
Homepage = "https://github.com/Everyome/everyome"

[tool.setuptools]
# Intent: the bundle folder is declared as its own package, so setuptools always ships it (it warns, and may later
# drop it, when a folder Python can import is left out of this list).
packages = ["everyome_pipelines", "everyome_pipelines.bundles"]

[tool.setuptools.package-data]
"everyome_pipelines.bundles" = ["*.tar.gz", "*.zip"]
