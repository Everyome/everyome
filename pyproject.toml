[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "everyome"
dynamic = ["version"]
description = "Every -ome, for everyone: omics analysis with a simple interface and every setting in reach, on your own computer or Slurm cluster."
readme = "README.md"
authors = [{ name = "Helen R Horkan" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
keywords = ["bioinformatics", "omics", "single-cell", "SPLiT-seq", "RNA-seq", "differential expression", "Slurm", "Nextflow", "GUI"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Framework :: FastAPI",
]
# Intent: keep the core light; heavy scientific packages belong to the modules that need them.
# httpx stays below 1.0 until 1.0 is tested with Everyome (its 1.0 pre-releases break the test client).
dependencies = ["fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.24,<1", "python-multipart", "pyyaml", "setproctitle"]

[project.optional-dependencies]
test = ["pytest"]
# Intent: what the SPLiT-seq module needs on the cluster (and on this computer for the demo).
# pandas stays below 4.0 until anndata stops using the pandas options 4.0 removes.
singlecell = ["numpy", "pandas<4", "scipy", "scanpy>=1.9", "anndata>=0.9", "harmonypy", "leidenalg", "igraph", "openpyxl", "seaborn", "matplotlib"]
# Intent: what the bulk RNA module's live session needs.
rna = ["numpy", "pandas<4", "matplotlib", "pydeseq2"]
# Intent: what the molecular biology tools need (they run on this computer).
molbio = ["primer3-py", "biopython"]
# Intent: the nf-core pipelines Everyome installs on clusters; always the same version as Everyome (docs/RELEASING.md).
pipelines = ["everyome-pipelines==0.1.0a3"]
all = ["everyome[singlecell,rna,molbio,pipelines]"]
# Intent: everything for developing and testing from a checkout. It leaves out the pipelines package, which the
# tests don't need and which can't be installed before its version is on PyPI.
dev = ["everyome[test,singlecell,rna,molbio]"]
# Intent: dev plus a real browser for tests/test_browser.py (then: python -m playwright install chromium).
browser = ["everyome[dev]", "playwright"]

[project.urls]
Homepage = "https://github.com/Everyome/everyome"
Source = "https://github.com/Everyome/everyome"
Issues = "https://github.com/Everyome/everyome/issues"
Citation = "https://github.com/Everyome/everyome/blob/main/CITATION.cff"
Acknowledgements = "https://github.com/Everyome/everyome/blob/main/ACKNOWLEDGEMENTS.md"

[project.scripts]
everyome = "everyome.__main__:main"

[tool.setuptools.dynamic]
# Intent: one place for the version number (everyome/__init__.py).
version = { attr = "everyome.__version__" }

[tool.setuptools.packages.find]
include = ["everyome*"]

[tool.setuptools.package-data]
everyome = ["suites.yaml", "pipelines.lock.json", "static/*", "static/fonts/*", "modules/*/*/module.yaml", "modules/*/*/*.js", "modules/*/*/demo/*", "modules/*/*/demo/*/*", "modules/*/*/docs/*", "modules/*/*/docs/*/*",
  "modules/*/*/workflow/*/*", "modules/*/*/templates/*", "modules/*/*/pipeline/*", "modules/*/shared/*/*"]
